<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math 2255 - Complete Lecture Notes</title>
<style>
:root{color-scheme:light;--bg:#fbfaf7;--panel:#f2f0ea;--line:#cbc5b9;--text:#16181b;--muted:#5c676d;--accent:#8f6a05}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}
header{position:sticky;top:0;z-index:10;padding:22px clamp(18px,4vw,64px);background:rgba(251,250,247,.96);border-bottom:1px solid var(--line)}
h1{margin:0 0 6px;color:var(--accent);font-size:clamp(1.5rem,3vw,2.4rem)}
header p{margin:0;color:var(--muted);font-family:system-ui,sans-serif;font-size:.9rem}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
nav a{padding:7px 11px;border:1px solid var(--line);border-radius:5px;color:var(--text);font:12px system-ui,sans-serif;text-decoration:none}
nav a:hover{border-color:var(--accent);color:var(--accent)}
main{max-width:1400px;margin:0 auto;padding:24px clamp(12px,3vw,48px) 64px}
section{scroll-margin-top:150px;margin:0 0 32px;border:1px solid var(--line);background:var(--panel)}
section h2{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);color:var(--accent);font-size:1.25rem}
iframe{display:block;width:100%;height:720px;border:0;background:#fbfaf7}
@media print{header{position:static}nav{display:none}section{border:0;break-before:page}iframe{height:1100px}}
</style>
</head>
<body>
<header>
  <h1>Math 2255 - Complete Lecture Notes</h1>
  <p>Lectures 1-5, collected from the interactive lecture boards.</p>
  <nav aria-label="Lecture navigation">
    <a href="#lecture-1">Lecture 1</a>
    <a href="#lecture-2">Lecture 2</a>
    <a href="#lecture-3">Lecture 3</a>
    <a href="#lecture-4">Lecture 4</a>
    <a href="#lecture-5">Lecture 5</a>
  </nav>
</header>
<main>
  <section id="lecture-1"><h2>Lecture 1</h2><iframe src="l01.html" title="Math 2255 Lecture 1 notes"></iframe></section>
  <section id="lecture-2"><h2>Lecture 2</h2><iframe src="l02.html" title="Math 2255 Lecture 2 notes"></iframe></section>
  <section id="lecture-3"><h2>Lecture 3</h2><iframe src="l03.html" title="Math 2255 Lecture 3 notes"></iframe></section>
  <section id="lecture-4"><h2>Lecture 4</h2><iframe src="l04.html" title="Math 2255 Lecture 4 notes"></iframe></section>
  <section id="lecture-5"><h2>Lecture 5</h2><iframe src="l05.html" title="Math 2255 Lecture 5 notes"></iframe></section>
</main>
</body>
</html>
